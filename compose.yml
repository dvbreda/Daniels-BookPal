# Daniels BookPal op de NAS.
#
# De paden hieronder komen uit .env (zie .env.example). Zo hoef je dit bestand
# niet aan te passen en blijft een `git pull` conflictvrij.
#
# De collectie is schrijfbaar aangekoppeld omdat importeren gevolgde series als
# gewone bestanden in je eigen mappen zet. Buiten dat importeren schrijft
# BookPal niets in je collectie: de scanner leest alleen, en de beeldcache en
# database staan in /data.
services:
  bookpal:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        # Jouw NAS-gebruiker: `id -u` / `id -g`. Bestanden in je collectie
        # staan vaak op 600 (alleen de eigenaar mag lezen), dus zonder deze
        # match ziet bookpal niets anders dan "permission denied".
        UID: "${HOST_UID:-1000}"
        GID: "${HOST_GID:-1000}"
    image: bookpal:latest
    container_name: bookpal
    restart: unless-stopped
    ports:
      # Buiten 1997, binnen 8000. Open dus http://<nas>:1997
      - "1997:8000"
    environment:
      BOOKPAL_CACHE_MAX_MB: "${BOOKPAL_CACHE_MAX_MB:-4096}"
      # M8: zonder sleutel blijft alles werken, alleen de vertaalknop is dan uit.
      BOOKPAL_GEMINI_API_KEY: "${BOOKPAL_GEMINI_API_KEY:-}"
      BOOKPAL_GEMINI_MODEL: "${BOOKPAL_GEMINI_MODEL:-gemini-3-flash-preview}"
      BOOKPAL_TRANSLATE_LANG: "${BOOKPAL_TRANSLATE_LANG:-nl}"
      BOOKPAL_SIDECAR_DIR: /data/vertalingen
    volumes:
      - bookpal-data:/data
      # Vertalingen kosten geld, dus ze staan buiten de database: in mappen op
      # naam van serie en hoofdstuk, zodat ze een herbouwde database overleven.
      # Standaard in het data-volume. Wil je er zelf in kunnen bladeren, zet dan
      # een absoluut NAS-pad in .env — bijvoorbeeld:
      #   BOOKPAL_VERTALINGEN=/volume1/_vertalingen
      - "${BOOKPAL_VERTALINGEN:-bookpal-vertalingen}:/data/vertalingen"
      # Links het pad op de NAS, rechts het pad in de container. Die rechterkant
      # vul je in bij Instellingen — dus /library/strips, niet /volume1/_strips.
      #
      # Schrijfbaar, want importeren zet gevolgde series als gewone bestanden in
      # je eigen mappen. BookPal schrijft alleen in een submap op serienaam en
      # verwijdert nooit iets wat het niet zelf heeft neergezet. Wil je dat
      # niet, zet er dan `:ro` achter — alles behalve importeren werkt dan nog.
      - "${BOOKPAL_BOEKEN:-/volume1/_boeken}:/library/boeken"
      - "${BOOKPAL_STRIPS:-/volume1/_strips}:/library/strips"
      - "${BOOKPAL_MANGA:-/volume1/_manga}:/library/manga"
      # Losse bestanden die je erin wilt zetten: downloads, een Dropbox-map,
      # wat iemand je stuurt. Importeren verplaatst ze naar een van je mappen
      # hierboven, dus deze mag niet read-only.
      - "${BOOKPAL_INTAKE:-/volume1/_intake}:/intake"
      #
      # Heb je alles onder één map staan (bijvoorbeeld /volume1/_boeken met
      # daarin strips/ en manga/)? Haal de drie regels hierboven weg, zet deze
      # ervoor in de plaats:
      #
      #   - "/volume1/_boeken:/library:ro"
      #
      # en voeg in Instellingen drie roots toe die naar de submappen wijzen:
      # /library/strips, /library/manga en /library (of /library/boeken).
      #
      # Aparte roots per soort is hoe dan ook de betere keuze: de standaard-
      # herkomst is een instelling *per root*, en dat is precies wat "manga uit
      # Japan" laat werken bij bestanden zonder ComicInfo.xml.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 20s

volumes:
  bookpal-data:
  bookpal-vertalingen:
