name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # libarchive leest de cbr/cb7-bestanden die de tests genereren.
      - name: Systeembibliotheken
        run: sudo apt-get update && sudo apt-get install -y libarchive13 libarchive-tools

      - name: Installeren
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        working-directory: server
        run: |
          ruff check .
          ruff format --check .

      - name: Mypy
        working-directory: server
        run: mypy bookpal

      - name: Tests
        working-directory: server
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Installeren
        working-directory: web
        run: npm ci || npm install

      - name: Typecheck
        working-directory: web
        run: npm run lint

      - name: Tests
        working-directory: web
        run: npm test

      - name: Build
        working-directory: web
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image bouwen
        run: docker build -f docker/Dockerfile -t bookpal:ci .
