# Daniels BookPal op de NAS.
#
# Pas de paden onder `volumes` aan naar je eigen mappen. De server leest ze
# alleen (`:ro`) — BookPal schrijft nooit in je collectie, alleen in /data.
services:
  bookpal:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: bookpal:latest
    container_name: bookpal
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Hoeveel schijf de beeldcache maximaal mag gebruiken.
      BOOKPAL_CACHE_MAX_MB: "4096"
    volumes:
      - bookpal-data:/data
      # Je collectie. De paden links zijn die op de NAS, rechts die in de
      # container — en die rechterkant vul je in bij Instellingen.
      - /volume1/media/strips:/library/strips:ro
      - /volume1/media/manga:/library/manga:ro
      - /volume1/media/boeken:/library/boeken:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 20s

volumes:
  bookpal-data:
